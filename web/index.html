<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>claude-rooms</title>
<style>
:root {
  --bg:#f6f5f2; --surface:#ffffff; --sunk:#efeee9; --ink:#141413; --ink-2:#55534e; --line:#e2e0da;
  --accent:#1d5fb0; --accent-ink:#ffffff; --accent-soft:#e7effa;
  --signal:#a8321a; --signal-soft:#fbe9e2; --critical:#b3261e; --critical-soft:#fbe7e5;
  --ok:#1e7a3a; --ok-soft:#e5f3e9; --warn-stripe:#e0a100;
  --r-card:12px; --r-btn:10px; --tab-h:58px;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
:root[data-theme="dark"] { color-scheme:dark;
  --bg:#111110; --surface:#1b1b1a; --sunk:#232321; --ink:#f2f1ec; --ink-2:#b9b7ae; --line:#2e2d2a;
  --accent:#7fb2f5; --accent-ink:#111110; --accent-soft:#1c2a3d;
  --signal:#ff9b7e; --signal-soft:#3a1f17; --critical:#ff8a80; --critical-soft:#3b1d1b;
  --ok:#6fcf8b; --ok-soft:#173222; --shadow:none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { color-scheme:dark;
  --bg:#111110; --surface:#1b1b1a; --sunk:#232321; --ink:#f2f1ec; --ink-2:#b9b7ae; --line:#2e2d2a;
  --accent:#7fb2f5; --accent-ink:#111110; --accent-soft:#1c2a3d;
  --signal:#ff9b7e; --signal-soft:#3a1f17; --critical:#ff8a80; --critical-soft:#3b1d1b;
  --ok:#6fcf8b; --ok-soft:#173222; --shadow:none; } }
* { box-sizing:border-box; }
html,body { margin:0; background:var(--bg); color:var(--ink); }
body { padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 16px); -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; cursor:pointer; }
main { max-width:560px; margin:0 auto; padding:calc(env(safe-area-inset-top) + 12px) 14px 0; }
h1 { font-size:28px; line-height:1.15; margin:8px 0 2px; letter-spacing:-.01em; }
h1 .count { color:var(--signal); }
.pulse { display:flex; flex-wrap:wrap; gap:4px 12px; margin:2px 0 14px; padding:0; border:0; background:none; font-size:14px; color:var(--ink-2); text-align:left; min-height:44px; align-items:center; }
.pulse b { color:var(--ink); font-weight:600; }
.sec { font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:22px 2px 8px; display:flex; justify-content:space-between; }
.empty { padding:28px 8px; text-align:center; color:var(--ink-2); }
.empty b { display:block; font-size:20px; color:var(--ink); margin-bottom:6px; }
.offline { position:sticky; top:0; z-index:5; background:var(--sunk); border-bottom:1px solid var(--line); padding:8px 14px; font-size:14px; text-align:center; }

/* cards */
.card { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:12px 14px 6px; margin:0 0 12px; box-shadow:var(--shadow); position:relative; }
.card.urgent { border-color:var(--critical); }
.meta { display:flex; align-items:center; gap:6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-2); min-height:20px; }
.meta .room { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.meta .sp { flex:1; }
.meta .rid { flex:none; font-variant-numeric:tabular-nums; }
.meta .rid::before { content:"· "; }
.pill { display:inline-flex; align-items:center; gap:4px; border-radius:999px; padding:1px 8px; font-size:12px; font-weight:600; letter-spacing:0; text-transform:none; border:1px solid var(--line); color:var(--ink-2); white-space:nowrap; }
.pill.old { border-color:var(--signal); color:var(--signal); }
.pill.urgent { background:var(--critical-soft); border-color:var(--critical); color:var(--critical); }
.pill.reply { background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
.q { font-size:18px; font-weight:600; line-height:1.3; margin:6px 0 4px; }
.cons { font-size:14px; color:var(--ink-2); margin:0 0 10px; }
.paused-note { font-size:14px; background:var(--sunk); border-radius:8px; padding:8px 10px; margin:0 0 10px; display:flex; gap:8px; align-items:flex-start; }
.paused-note label { display:flex; gap:6px; align-items:center; margin-top:4px; min-height:32px; }
.opts { display:grid; gap:8px; }
.opt { display:flex; gap:10px; align-items:flex-start; width:100%; min-height:56px; padding:10px 12px; text-align:left; background:var(--surface); border:1.5px solid var(--line); border-radius:var(--r-btn); transition:background .15s, border-color .15s; }
.opt:active { background:var(--sunk); }
.opt .k { flex:none; width:26px; height:26px; border-radius:50%; display:grid; place-items:center; background:var(--sunk); font-weight:700; font-size:14px; margin-top:1px; }
.opt .l { flex:1; min-width:0; }
.opt .l b { display:block; font-weight:600; }
.opt .l small { display:block; color:var(--ink-2); font-size:14px; margin-top:2px; }
.opt .tag { flex:none; font-size:12px; font-weight:600; color:var(--ok); border:1px solid var(--ok); border-radius:999px; padding:1px 8px; margin-top:3px; }
.opt.pick { border-color:var(--ok); }
.opt.sel { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.opt.sel .k { background:rgba(0,0,0,.18); }
.opt.sel small { color:inherit; opacity:.85; }
.why1 { font-size:14px; color:var(--ink-2); margin:8px 2px 0; }
.why1 b { color:var(--ok); font-weight:600; }
.foot { display:flex; gap:2px; margin:6px -8px 0; border-top:1px solid var(--line); padding-top:2px; }
.foot button { background:none; border:0; min-height:44px; padding:0 10px; font-size:15px; color:var(--accent); font-weight:500; }
.foot .sp { flex:1; }
.foot .lock { display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink-2); padding:0 8px; }
textarea, input[type=text] { width:100%; font:inherit; font-size:16px; color:var(--ink); background:var(--bg); border:1.5px solid var(--line); border-radius:var(--r-btn); padding:10px 12px; }
textarea:focus, input:focus, button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.notebox { margin:10px 0 2px; }
.notebox small { display:block; font-size:12px; color:var(--ink-2); margin:4px 2px; }
.primary { display:block; width:100%; min-height:52px; border:0; border-radius:var(--r-btn); background:var(--accent); color:var(--accent-ink); font-weight:600; font-size:16px; }
.secondary { display:block; width:100%; min-height:48px; border:1.5px solid var(--line); border-radius:var(--r-btn); background:var(--surface); font-weight:600; }
.row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:10px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 8px; }
.chip { min-height:36px; padding:0 12px; border-radius:999px; border:1px solid var(--line); background:var(--sunk); font-size:14px; }
.steps { list-style:none; margin:0 0 10px; padding:0; counter-reset:s; }
.steps li { display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); counter-increment:s; }
.steps li:first-child { border-top:0; }
.steps input[type=checkbox] { width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:var(--ok); }
.steps .t { flex:1; min-width:0; font-size:15px; }
.steps .t::before { content:counter(s) ". "; color:var(--ink-2); }
.steps li.done .t { color:var(--ink-2); text-decoration:line-through; }
.steps code { font:13px ui-monospace,Menlo,monospace; background:var(--sunk); padding:1px 4px; border-radius:4px; overflow-wrap:anywhere; }
.copy { flex:none; min-height:36px; min-width:56px; border:1px solid var(--line); background:var(--surface); border-radius:8px; font-size:13px; font-weight:600; color:var(--accent); }
.thread { margin:8px 0 10px; display:grid; gap:6px; }
.bub { font-size:14px; padding:8px 10px; border-radius:10px; background:var(--sunk); max-width:90%; }
.bub.me { justify-self:end; background:var(--accent-soft); }
.bub small { display:block; font-size:12px; color:var(--ink-2); margin-bottom:2px; }
.countdown { font-size:14px; font-weight:600; color:var(--signal); white-space:nowrap; }

/* receipt */
.receipt { background:var(--surface); border:1.5px solid var(--ok); border-radius:var(--r-card); padding:12px 14px; margin:0 0 12px; position:relative; overflow:hidden; }
.receipt .r1 { display:flex; gap:10px; align-items:center; }
.receipt .r1 .tx { flex:1; min-width:0; }
.receipt .r1 b { display:block; }
.receipt .r1 small { color:var(--ink-2); font-size:14px; }
.receipt .undo { flex:none; min-height:44px; padding:0 16px; border-radius:var(--r-btn); border:1.5px solid var(--accent); background:none; color:var(--accent); font-weight:700; }
.receipt .drain { position:absolute; left:0; bottom:0; height:3px; background:var(--accent); width:100%; transform-origin:left; }
.receipt.fail { border-color:var(--critical); }
.tick { color:var(--ok); font-weight:700; }

/* alarm */
.alarm { background:var(--critical-soft); border:1.5px solid var(--critical); border-radius:var(--r-card); padding:12px 14px; margin:0 0 12px; }
.alarm .h { display:flex; gap:8px; align-items:center; font-weight:700; color:var(--critical); }
.alarm p { margin:4px 0 10px; }
.alarm .acts { display:flex; gap:8px; }
.alarm .acts button { min-height:44px; padding:0 16px; border-radius:var(--r-btn); font-weight:600; }
.alarm .go { background:var(--critical); color:#fff; border:0; }
:root[data-theme="dark"] .alarm .go { color:#111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .alarm .go { color:#111; } }
.alarm .ghost { background:none; border:1.5px solid var(--line); }
.alarm.okay { background:var(--ok-soft); border-color:var(--ok); }
.alarm.okay .h { color:var(--ok); }

.group { display:flex; align-items:center; gap:10px; width:100%; min-height:52px; background:var(--surface); border:1px dashed var(--line); border-radius:var(--r-card); padding:8px 14px; margin:0 0 12px; text-align:left; }
.group .gtx { flex:1; }
.group small { color:var(--ink-2); }

/* rooms list */
.rlist { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; }
.rrow { display:flex; gap:12px; align-items:flex-start; width:100%; padding:12px 14px; min-height:64px; border:0; border-top:1px solid var(--line); background:none; text-align:left; }
.rrow:first-child { border-top:0; }
.rrow .tx { flex:1; min-width:0; }
.rrow .tx b { display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.rrow .tx small { display:block; color:var(--ink-2); font-size:14px; }
.rrow .tx small.when { font-size:12px; margin-top:2px; }
.badge { flex:none; min-width:24px; height:24px; padding:0 7px; border-radius:12px; background:var(--signal); color:#fff; font-size:13px; font-weight:700; display:grid; place-items:center; margin-top:2px; }
:root[data-theme="dark"] .badge { color:#111; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .badge { color:#111; } }
.chev { color:var(--ink-2); margin-top:2px; }

/* status glyph */
.st { flex:none; display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; font-size:12px; font-weight:800; margin-top:1px; }
.st-needs_you { background:var(--signal-soft); color:var(--signal); }
.st-stuck { background:var(--critical-soft); color:var(--critical); }
.st-moving { background:var(--accent-soft); color:var(--accent); }
.st-waiting_outside, .st-paused, .st-idle { background:var(--sunk); color:var(--ink-2); }
.st-done { background:var(--ok-soft); color:var(--ok); }

/* room screen */
.back { background:none; border:0; color:var(--accent); min-height:44px; padding:0; font-size:16px; }
.hero { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:14px; margin:6px 0 12px; }
.hero.stuck { border-color:var(--critical); background:var(--critical-soft); }
.hero .sline { display:flex; gap:10px; align-items:flex-start; font-size:17px; font-weight:600; }
.hero .who { font-size:14px; color:var(--ink-2); margin:6px 0 0 32px; }
.hero .primary { margin-top:12px; }
.phase { color:var(--ink-2); margin:0 2px 4px; }
.items { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; }
.it { display:flex; gap:10px; align-items:baseline; padding:10px 14px; min-height:48px; border-top:1px solid var(--line); width:100%; background:none; border-left:0; border-right:0; border-bottom:0; text-align:left; font-size:15px; }
.it:first-child { border-top:0; }
.it .id { flex:none; font:600 12px ui-monospace,Menlo,monospace; color:var(--ink-2); width:34px; }
.it .tt { flex:1; min-width:0; }
.it .tt small { display:block; font-size:13px; color:var(--ink-2); }
.it .star { color:var(--signal); font-weight:700; }
.note { background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); padding:12px 14px; font-size:15px; }
.note small { color:var(--ink-2); }

.team-body { border-top:1px solid var(--line); }
.team-member { padding:12px 14px; border-top:1px solid var(--line); }
.team-member:first-child { border-top:0; }
.team-member > b { font-size:14px; }
.team-task { display:flex; flex-direction:column; gap:2px; min-height:48px; text-align:left; background:none; border:0; padding:8px 0; width:100%; font-size:14px; }
/* Plan stays a single quiet row until opened. */
.plan { margin-top:22px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-card); overflow:hidden; }
.plan-toggle { width:100%; min-height:64px; display:flex; align-items:center; gap:12px; padding:12px 14px; border:0; background:none; text-align:left; }
.plan-toggle .tt { flex:1; }
.plan-toggle b, .plan-toggle small { display:block; }
.plan-toggle small { color:var(--ink-2); font-size:13px; margin-top:2px; }
.plan-help { margin:0; padding:0 14px 12px; font-size:13px; color:var(--ink-2); }
.plan-scroll { overflow:auto; max-height:520px; border-top:1px solid var(--line); background:var(--bg); }
.plan-canvas { position:relative; }
.plan-links { position:absolute; inset:0; pointer-events:none; color:var(--ink-2); }
.plan-node { position:absolute; width:216px; height:150px; padding:10px 12px; background:var(--surface); border:1px solid var(--line); border-radius:10px; text-align:left; display:flex; flex-direction:column; gap:5px; overflow:hidden; }
.plan-node:hover { border-color:var(--accent); }
.plan-node.doing { border-color:var(--accent); }
.plan-node.blocked { border-color:var(--signal); }
.plan-node.dropped { border-style:dashed; }
.plan-node .meta { justify-content:space-between; font-size:11px; letter-spacing:0; text-transform:none; }
.plan-node .node-title { font-size:14px; line-height:1.35; font-weight:600; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.plan-node .node-summary { font-size:12px; line-height:1.4; color:var(--ink-2); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; overflow-wrap:anywhere; }
.plan-node .node-state { color:var(--ink-2); }
.plan-node.doing .node-state { color:var(--accent); }
.plan-node.done .node-state { color:var(--ok); }
.plan-node.blocked .node-state { color:var(--signal); }
.plan-stub { border-style:dashed; background:var(--sunk); justify-content:center; }
.plan-bar { display:flex; flex-wrap:wrap; align-items:center; gap:8px 12px; padding:0 14px 12px; }
.plan-bar .plan-help { flex:1; min-width:180px; padding:0; }
/* Narrow screens get the plan as stages (dependency depth); wide ones get the graph. */
.plan-scroll, .g-only { display:none; }
.plan-list { border-top:1px solid var(--line); }
.plan-stage { display:flex; justify-content:space-between; padding:14px 14px 6px; background:var(--bg); border-top:1px solid var(--line); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); }
.plan-list > :first-child { border-top:0; }
.plan-it .tt small.sum { color:var(--ink); display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; overflow:hidden; }
.plan-it .node-state { flex:none; font-size:12px; font-weight:600; color:var(--ink-2); }
.plan-it.doing .node-state { color:var(--accent); }
.plan-it.done .node-state { color:var(--ok); }
.plan-it.blocked .node-state { color:var(--signal); }
.plan-it.done .tt, .plan-it.dropped .tt { color:var(--ink-2); }
.plan-gone { display:flex; align-items:center; gap:10px; padding:8px 14px; min-height:48px; font-size:14px; color:var(--ink-2); background:var(--bg); }
.plan-gone span { flex:1; }
.plan-gone button { background:none; border:0; min-height:44px; padding:0 4px; color:var(--accent); font-weight:500; font-size:15px; }
.col-side { display:none; }

/* more */
.seg { display:inline-grid; grid-auto-flow:column; background:var(--sunk); border-radius:10px; padding:3px; gap:2px; }
.seg button { border:0; background:none; min-height:38px; padding:0 12px; border-radius:8px; font-size:14px; color:var(--ink-2); }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); font-weight:600; box-shadow:var(--shadow); }
.setrow { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 14px; min-height:56px; border-top:1px solid var(--line); }
.setrow:first-child { border-top:0; }
.small { font-size:13px; color:var(--ink-2); }

/* tab bar */
nav.tabs { position:fixed; left:0; right:0; bottom:0; z-index:10; background:var(--surface); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); }
nav.tabs .in { max-width:560px; margin:0 auto; display:grid; grid-template-columns:repeat(3,1fr); }
nav.tabs a { position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center; height:var(--tab-h); color:var(--ink-2); text-decoration:none; font-size:12px; font-weight:600; gap:2px; }
nav.tabs a[aria-current="page"] { color:var(--accent); }
nav.tabs svg { width:24px; height:24px; }
nav.tabs .badge { position:absolute; top:5px; left:calc(50% + 6px); height:20px; min-width:20px; font-size:12px; margin:0; }

/* sheets */
dialog { border:0; padding:0; width:100%; max-width:560px; max-height:88vh; margin:auto auto 0; border-radius:16px 16px 0 0; background:var(--surface); color:var(--ink); }
dialog::backdrop { background:rgba(0,0,0,.4); }
.sh { padding:8px 16px calc(20px + env(safe-area-inset-bottom)); }
.grab { width:40px; height:5px; border-radius:3px; background:var(--line); margin:4px auto 8px; }
.sh .top { display:flex; gap:10px; align-items:flex-start; }
.sh .top h2 { flex:1; font-size:19px; margin:0; line-height:1.3; }
.x { flex:none; width:44px; height:44px; border-radius:50%; border:0; background:var(--sunk); font-size:20px; }
.sh h3 { font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-2); margin:18px 0 6px; }
.sh p { margin:0 0 8px; }
.sh code { font:13px ui-monospace,Menlo,monospace; background:var(--sunk); padding:1px 4px; border-radius:4px; }
.toast { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(var(--tab-h) + env(safe-area-inset-bottom) + 12px); z-index:20; background:var(--ink); color:var(--bg); border-radius:12px; padding:12px 16px; font-size:15px; max-width:calc(100vw - 28px); box-shadow:0 4px 16px rgba(0,0,0,.25); }
.toast[hidden] { display:none; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
.changed { font-size:14px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:8px; padding:8px 10px; margin:0 0 10px; width:100%; text-align:left; }
.skel { height:140px; border-radius:var(--r-card); background:var(--sunk); margin:0 0 12px; }
.sec-body { white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; margin:0 0 8px; }
.err { color:var(--critical); font-size:14px; margin:6px 0 0; }

/* Wide screens: tabs move to a top bar, the inbox gets a rooms column, the room
   view splits work from context, and the plan spans the full width as a graph. */
@media (min-width: 960px) {
  body { padding-bottom:32px; }
  main { max-width:1180px; padding:calc(var(--tab-h) + 16px) 28px 0; }
  main[data-view="rooms"], main[data-view="more"] { max-width:760px; }
  .offline { top:var(--tab-h); }
  nav.tabs { top:0; bottom:auto; border-top:0; border-bottom:1px solid var(--line); padding-bottom:0; }
  nav.tabs .in { max-width:1180px; padding:0 20px; display:flex; gap:4px; }
  main[data-view="rooms"] ~ nav.tabs .in, main[data-view="more"] ~ nav.tabs .in { max-width:760px; }
  nav.tabs a { flex-direction:row; gap:8px; padding:0 14px; font-size:14px; }
